<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="224" height="224" rx="32" ry="32" fill="url(#bgGrad)"/>
  
  <!-- Monitor frame -->
  <rect x="50" y="60" width="156" height="110" rx="8" ry="8" fill="url(#monitorGrad)" stroke="#60a5fa" stroke-width="4"/>
  
  <!-- Monitor screen (off/dark) -->
  <rect x="58" y="68" width="140" height="94" rx="4" ry="4" fill="url(#screenGrad)"/>
  
  <!-- Monitor stand/base -->
  <rect x="108" y="170" width="40" height="12" rx="4" ry="4" fill="url(#monitorGrad)" stroke="#60a5fa" stroke-width="3"/>
  <rect x="118" y="182" width="20" height="8" rx="2" ry="2" fill="url(#monitorGrad)"/>
  
  <!-- Power button (off indicator) -->
  <circle cx="200" cy="100" r="16" fill="url(#powerGrad)" stroke="#ffffff" stroke-width="2"/>
  <line x1="200" y1="88" x2="200" y2="112" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- "P" badge -->
  <circle cx="200" cy="56" r="28" fill="#fbbf24"/>
  <text x="188" y="67" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#1e40af">P</text>
  
  <!-- Power off indicator lines (subtle) -->
  <line x1="70" y1="85" x2="186" y2="85" stroke="#374151" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="70" y1="145" x2="186" y2="145" stroke="#374151" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>

